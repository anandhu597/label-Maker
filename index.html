<!DOCTYPE html>
<!--
  =====================================================================
  FILE LABEL MAKER  -  index.html  (the STRUCTURE of the page)
  =====================================================================
  This project has 3 files. Keep them in the SAME folder:

    index.html  -> what is on the page (this file)
    style.css   -> how it looks (colours, sizes, layout)
    script.js   -> how it behaves (typing, buttons, PDF)

  To use it: double-click index.html. An internet connection is needed
  the first time (the font and the PDF library load from the internet).
  =====================================================================
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File label maker</title>

  <!-- Heavy "Archivo" font used on the labels -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&display=swap" rel="stylesheet">

  <!-- Our own styles -->
  <link rel="stylesheet" href="style.css">

  <!-- html2pdf.js: the library that turns the sheet into a PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

  <!-- ============ PAGE TITLE ============ -->
  <header>
    <h1>File label maker</h1>
    <p>Spine labels at 4.8 × 18.7 cm, up to five per A4 landscape sheet.</p>
  </header>

  <main>

    <!-- ============ 1. THE FORM ============
         Every input has data-field="..." . That name must match a key
         of the "form" object in script.js, so one piece of JavaScript
         can handle all of them. -->
    <section class="card" aria-label="Label details">
      <h2>Label details</h2>

      <!-- Company dropdown -->
      <label class="field">Company
        <select data-field="company">
          <option value="shula">Al Shula General Trading Co. L.L.C.</option>
          <option value="quraishi">Al Quraishi Trading Company</option>
          <option value="custom">Custom / 3rd location</option>
        </select>
      </label>

      <!-- Only shown when "Custom" is chosen (script.js shows/hides it) -->
      <div id="customFields" hidden>
        <label class="field">Company name (English)
          <input data-field="customName" type="text">
        </label>
        <label class="field">Company name (Arabic)
          <input data-field="customArabic" type="text" dir="rtl">
        </label>
        <label class="field">Logo colour
          <input data-field="customColor" type="color">
        </label>
      </div>

      <!-- Optional: upload your own logo picture -->
      <div class="button-row">
        <label class="field no-margin">Logo image (optional)
          <input id="logoInput" type="file" accept="image/*">
        </label>
        <button id="resetLogoBtn" type="button">Use default logo</button>
      </div>

      <!-- Year and volume side by side -->
      <div class="grid-2">
        <label class="field">Year
          <input data-field="year" type="text" inputmode="numeric">
        </label>
        <label class="field">Volume number
          <input data-field="volume" type="text" placeholder="01">
        </label>
      </div>

      <label class="field">Document code or number
        <input data-field="code" type="text" placeholder="U01-INV or 5046">
      </label>

      <!-- Document type: preset colours, or your own -->
      <div class="divider">
        <label class="field">Document type preset
          <select data-field="preset">
            <option value="INV">INV (Invoices) – yellow</option>
            <option value="CRN">CRN (Credit notes) – orange</option>
            <option value="JV">JV (Journal vouchers) – light blue</option>
            <option value="PURCHASE ORDERS">Purchase orders – dark teal</option>
            <option value="PAYMENT VOUCHERS">Payment vouchers – purple</option>
            <option value="custom">Custom colours</option>
          </select>
        </label>

        <label class="field">Document type / title
          <input data-field="title" type="text">
        </label>

        <div class="grid-2">
          <label class="field">Banner colour
            <input data-field="bgColor" type="color">
          </label>
          <label class="field">Banner text colour
            <input data-field="textColor" type="color">
          </label>
        </div>
      </div>

      <!-- Serial number range -->
      <div class="grid-2">
        <label class="field">Range from
          <input data-field="from" type="text" placeholder="Start serial">
        </label>
        <label class="field">Range to
          <input data-field="to" type="text" placeholder="End serial">
        </label>
      </div>
      <p class="hint">Leave the range blank to write it by hand after printing.</p>
    </section>


    <!-- ============ 2. LIVE PREVIEW ============
         script.js draws one label inside <div id="preview"> -->
    <section class="card" aria-label="Live preview">
      <h2>Live preview</h2>
      <p class="hint">Shown at actual size.</p>

      <div class="preview-box">
        <div id="preview"></div>
      </div>

      <div class="button-row">
        <button id="addBtn" class="primary" type="button">Add label to sheet</button>
        <label class="inline-label">
          <input id="autoBump" type="checkbox" checked>
          Raise the volume number by 1 after adding
        </label>
      </div>
    </section>


    <!-- ============ 3. PRINT SHEET ============ -->
    <section class="card sheet-card" aria-label="Print sheet">

      <!-- Title + buttons -->
      <div class="sheet-toolbar">
        <h2>Print sheet <span id="count"></span></h2>
        <button id="clearBtn" type="button">Clear sheet</button>
        <button id="pdfBtn" class="primary" type="button">Download PDF</button>
      </div>

      <!-- The A4 landscape paper. script.js puts the labels inside it. -->
      <div id="sheetWrap" class="sheet-wrap">
        <div id="sheet" class="paper"></div>
      </div>

      <!-- One small button per queued label, click to remove it -->
      <div id="chips" class="chips"></div>

      <!-- Messages such as "The sheet is full" -->
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

  </main>

  <!-- Our JavaScript goes LAST so the page above already exists when it runs -->
  <script src="script.js"></script>
</body>
</html>
